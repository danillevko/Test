<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>world</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="video-wrapper">
        <img src="./img/hero-video-img.png" alt="" class="video-thumbnail">
        <button class="play-button" onclick="playVideo()">▶</button>
        <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls style="display: none;" class="video" id="myVideo">
            <source>
        </video>
    </div>
    <script>
        function playVideo() {
            const video = document.getElementById('myVideo');
            video.style.display = 'block';
            video.play();

            document.querySelector('.video-thumbnail').style.display = 'none';
            document.querySelector('.play-button').style.display = 'none';
        }
    </script>
</body>

</html>
